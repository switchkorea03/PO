{% extends 'base.html' %}{% block content %}<section class="login-card card"><p class="eyebrow">PO MANAGEMENT</p><h1>업무를 한눈에</h1><p class="muted">사내 계정으로 로그인하세요.</p><form method="post">{% csrf_token %}{% if form.errors %}<p class="error">사용자 이름과 비밀번호를 확인하세요.</p>{% endif %}<label>사용자 이름<input name="username" autocomplete="username" required autofocus></label><label>비밀번호<input type="password" name="password" autocomplete="current-password" required></label><input type="hidden" name="next" value="{{ next }}"><button class="primary">로그인</button></form></section>{% endblock %}
